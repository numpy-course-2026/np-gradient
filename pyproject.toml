# Окружение проекта «Градиент»: `uv sync` ставит Python 3.14, NumPy и pytest в .venv.
[project]
name = "np-gradient"
version = "0"
requires-python = ">=3.14"
dependencies = ["numpy>=2.5,<2.6"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
